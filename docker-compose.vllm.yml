version: '3.8'

services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: elective-chooser-vllm
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./models:/models  # Mount your local models directory
    environment:
      - HF_TOKEN=${HF_TOKEN}  # Your Hugging Face token
    command: >
      --model meta-llama/Meta-Llama-3.1-8B-Instruct
      --max-model-len 8192
      --gpu-memory-utilization 0.90
      --dtype float16
      --host 0.0.0.0
      --port 8000
      --served-model-name meta-llama/Meta-Llama-3.1-8B-Instruct
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - vllm-network

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: vllm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl  # SSL certificates
    depends_on:
      - vllm-server
    restart: unless-stopped
    networks:
      - vllm-network

networks:
  vllm-network:
    driver: bridge
